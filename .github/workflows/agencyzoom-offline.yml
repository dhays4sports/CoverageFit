name: AgencyZoom offline synthetic foundation
on:
  pull_request:
    paths:
      - 'server/agencyzoom-*.mjs'
      - 'server/shared-prospect-profile.mjs'
      - 'server/evidence-review-service.mjs'
      - 'server/shared-workspace-service.mjs'
      - 'server/signal-decision-core.mjs'
      - 'server/solo-desk-api.mjs'
      - 'server/producer-workspace.mjs'
      - 'shared/agencyzoom-*.mjs'
      - 'shared/prospect-workspace.mjs'
      - 'scripts/lib/agencyzoom-*.mjs'
      - 'scripts/lib/evidence-review-ledger.mjs'
      - 'scripts/evidence-review-demo.mjs'
      - 'scripts/evidence-lifecycle-demo.mjs'
      - 'scripts/producer-walkthrough.mjs'
      - 'scripts/archive-scale.mjs'
      - 'scripts/lib/archive-scale-worker.mjs'
      - 'scripts/lib/walkthrough-fixtures.mjs'
      - 'docs/walkthrough/**'
      - 'scripts/evidence-package.mjs'
      - 'scripts/lib/evidence-package.mjs'
      - 'scripts/agencyzoom-*.mjs'
      - 'assets/js/agencyzoom-*.mjs'
      - 'assets/js/shared-workspace-panel.mjs'
      - 'assets/js/evidence-review-panel.mjs'
      - 'assets/js/producer-workspace.mjs'
      - 'tests/agencyzoom-*.test.mjs'
      - 'tests/evidence-reconciliation.test.mjs'
      - 'tests/evidence-lifecycle.test.mjs'
      - 'tests/producer-walkthrough.test.mjs'
      - 'tests/helpers/evidence-lifecycle-*.mjs'
      - 'tests/helpers/evidence-review-fixture.mjs'
      - 'tests/helpers/agencyzoom-fixture.mjs'
      - 'tests/fixtures/agencyzoom/**'
      - '.github/workflows/agencyzoom-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/prospect-desk
      - run: node --test tests/*.test.mjs
      - run: npm test
        working-directory: apps/prospect-desk
      - run: node scripts/agencyzoom-synthetic-demo.mjs
      - run: node scripts/agencyzoom-task-renewal-demo.mjs
      - run: node scripts/agencyzoom-sms-demo.mjs
      - run: node scripts/evidence-review-demo.mjs
      - run: node scripts/evidence-lifecycle-demo.mjs
      - run: node scripts/archive-scale.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AgencyZoom-synthetic-acceptance
          path: |
            docs/agencyzoom/
            docs/walkthrough/
            docs/ARCHIVE-SCALE-DESIGN-0.6.md
            docs/PRODUCER-WALKTHROUGH-ARCHIVE-SCALE-0.6.md
          retention-days: 14
