name: AgencyZoom offline synthetic foundation
on:
  pull_request:
    paths:
      - 'server/agencyzoom-connector.mjs'
      - 'scripts/lib/agencyzoom-offline-store.mjs'
      - 'scripts/agencyzoom-synthetic-demo.mjs'
      - 'assets/js/agencyzoom-evidence.mjs'
      - 'assets/js/shared-workspace-panel.mjs'
      - 'assets/js/producer-workspace.mjs'
      - 'tests/agencyzoom-connector.test.mjs'
      - 'tests/fixtures/agencyzoom/**'
      - '.github/workflows/agencyzoom-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/agencyzoom-connector.test.mjs tests/shared-prospect-profile.test.mjs tests/shared-workspace.test.mjs tests/producer-workspace.test.mjs
      - run: node scripts/agencyzoom-synthetic-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AgencyZoom-synthetic-acceptance
          path: docs/agencyzoom/
          retention-days: 14
